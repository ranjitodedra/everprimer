<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sequence Builder</title>
  <style>
    html, body { margin: 0; background: #f4f7f4; color: #1c2430; font-family: system-ui, sans-serif; }
    main { padding: 24px 16px 32px; max-width: 28rem; }
    h1 { font-size: 1.5rem; line-height: 1.2; margin: 0 0 8px; }
    p { margin: 0 0 16px; font-size: 1.05rem; line-height: 1.4; }
    button {
      min-height: 48px;
      padding: 12px 16px;
      font-size: 1.125rem;
      border-radius: 12px;
      border: 2px solid #1f6b4a;
      background: #fff;
      color: #1c2430;
    }
    button:focus-visible { outline: 3px solid #1f6b4a; outline-offset: 2px; }
    ol { margin: 16px 0 0; padding-left: 1.25rem; font-size: 1.125rem; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
    html[data-reduced-motion="true"] button { transition: none; }
  </style>
</head>
<body>
  <main>
    <h1>Put the steps in order</h1>
    <p id="prompt">Tap the first step.</p>
    <button type="button" data-step="first">Place the first step</button>
    <ol id="order"></ol>
  </main>
  <script>
    var STEPS = {
      day: ["Morning", "Afternoon", "Night"],
      plants: ["Seed", "Sprout", "Flower"]
    };
    document.querySelector("[data-step=first]").addEventListener("click", function () {
      var params = window.ArtifactKit && window.ArtifactKit.params ? window.ArtifactKit.params : {};
      var topic = typeof params.topic === "string" ? params.topic : "day";
      var steps = STEPS[topic] || STEPS.day;
      var list = document.getElementById("order");
      list.textContent = "";
      var item = document.createElement("li");
      item.textContent = steps[0];
      list.appendChild(item);
      document.getElementById("prompt").textContent = "The order starts with " + steps[0] + ".";
      window.ArtifactKit.emit("step_placed", { topic: topic });
      window.ArtifactKit.emit("sequence_checked", { topic: topic });
    });
  </script>
</body>
</html>
