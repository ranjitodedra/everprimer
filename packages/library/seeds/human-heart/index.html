<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Human heart</title>
  <style>
    :root {
      --paper: #e7f1f3;
      --ink: #14242c;
      --rule: #8aa4ae;
      --body-fill: #d5e4ea;
      --body-ink: #1a4554;
      --lung-fill: #f3d2c6;
      --lung-ink: #6e2c2c;
      --path: #0f6e56;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.4;
      padding: 16px;
    }
    h1 {
      margin: 0 0 4px;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .facing {
      margin: 0 0 14px;
      max-width: 36em;
    }
    .heart, .sides {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px 18px;
      max-width: 28rem;
    }
    .heart { position: relative; }
    .heart::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 1px;
      background: var(--rule);
    }
    .sides { margin: 0 0 8px; }
    .side {
      margin: 0;
      font-size: 0.85rem;
      color: var(--body-ink);
    }
    .side.person-left { color: var(--lung-ink); }
    .chamber {
      position: relative;
      min-height: 72px;
      margin: 0;
      padding: 12px 28px 12px 12px;
      border: 2px solid transparent;
      border-radius: 18px 18px 28px 28px;
      text-align: left;
      cursor: pointer;
      color: inherit;
    }
    .chamber.from-body { background: var(--body-fill); color: var(--body-ink); }
    .chamber.from-lungs { background: var(--lung-fill); color: var(--lung-ink); }
    .chamber[aria-pressed="true"] { border-color: currentColor; }
    .chamber:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }
    .name { display: block; font-weight: 650; }
    .job { display: block; margin-top: 2px; font-weight: 450; }
    .pulse {
      position: absolute;
      top: 14px;
      right: 12px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: currentColor;
    }
    .chamber[aria-pressed="true"] .pulse {
      animation: beat var(--beat, 0.86s) ease-in-out infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse { animation: none; }
    }
    html[data-reduced-motion="true"] .pulse { animation: none; }
    .path {
      margin: 16px 0 0;
      max-width: 36em;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 1.2rem;
      line-height: 1.35;
      color: var(--path);
    }
  </style>
</head>
<body>
  <h1>Human heart</h1>
  <p class="facing">You are facing the person, so their left side is on your right. Each button is one chamber. The words under the name say where that blood is going.</p>
  <div class="sides">
    <p class="side">Person's right</p>
    <p class="side person-left">Person's left</p>
  </div>
  <div class="heart">
    <button type="button" class="chamber from-body" data-chamber="right-atrium" aria-pressed="false">
      <span class="name">Right atrium</span>
      <span class="job">Blood arrives from the body</span>
      <span class="pulse" aria-hidden="true"></span>
    </button>
    <button type="button" class="chamber from-lungs" data-chamber="left-atrium" aria-pressed="false">
      <span class="name">Left atrium</span>
      <span class="job">Blood arrives from the lungs</span>
      <span class="pulse" aria-hidden="true"></span>
    </button>
    <button type="button" class="chamber from-body" data-chamber="right-ventricle" aria-pressed="false">
      <span class="name">Right ventricle</span>
      <span class="job">Pumps blood to the lungs</span>
      <span class="pulse" aria-hidden="true"></span>
    </button>
    <button type="button" class="chamber from-lungs" data-chamber="left-ventricle" aria-pressed="false">
      <span class="name">Left ventricle</span>
      <span class="job">Pumps blood to the body</span>
      <span class="pulse" aria-hidden="true"></span>
    </button>
  </div>
  <p class="path" id="path" aria-live="polite">Tap a chamber to trace the path blood takes.</p>
  <script>
    var paths = {
      "right-atrium": "Blood from the body enters the right atrium, then the right ventricle, then the lungs.",
      "right-ventricle": "Blood leaves the right atrium, is pumped by the right ventricle, and goes to the lungs.",
      "left-atrium": "Blood from the lungs enters the left atrium, then the left ventricle, then the body.",
      "left-ventricle": "Blood from the lungs fills the left atrium, moves into the left ventricle, and leaves for the body."
    };
    var buttons = document.querySelectorAll("[data-chamber]");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener("click", function () {
        var chamber = this.getAttribute("data-chamber");
        var rate = 70;
        var params = window.ArtifactKit && window.ArtifactKit.params;
        if (params && typeof params.rate === "number") rate = params.rate;
        var reduce = window.ArtifactKit && window.ArtifactKit.reducedMotion;
        window.ArtifactKit.emit("chamber_selected", { chamber: chamber, rate: rate });
        window.ArtifactKit.emit("path_traced", { chamber: chamber, rate: rate });
        for (var j = 0; j < buttons.length; j++) {
          var on = buttons[j] === this;
          buttons[j].setAttribute("aria-pressed", on ? "true" : "false");
          if (on && !reduce && rate > 0) buttons[j].style.setProperty("--beat", (60 / rate) + "s");
        }
        document.getElementById("path").textContent = paths[chamber] + " It beats " + rate + " times each minute.";
      });
    }
  </script>
</body>
</html>
