<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d7e4ea">
  <title>Simple machines</title>
  <style>
    :root {
      --wall: #d7e4ea;
      --ink: #142b36;
      --steel: #3e5c6b;
      --yellow: #f0b429;
      --crate: #c4532a;
      --wood: #6e4528;
      --rope: #efe2c4;
      --stage: #102832;
      --paper: #f4f8f9;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      overscroll-behavior: none;
      background: var(--wall);
      color: var(--ink);
    }

    body {
      font-family: "Avenir Next", "Century Gothic", "Trebuchet MS", sans-serif;
      font-size: 16px;
      line-height: 1.4;
      padding:
        max(12px, env(safe-area-inset-top))
        max(12px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
    }

    main {
      max-width: 40rem;
    }

    h1 {
      margin: 0 0 4px;
      font-family: "American Typewriter", Rockwell, "Iowan Old Style", Palatino, Georgia, serif;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .prompt {
      margin: 0 0 10px;
      max-width: 38em;
    }

    #stage {
      background: var(--stage);
      color: var(--paper);
      border-radius: 6px 6px 0 0;
      padding: 8px 8px 0;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
    }

    .scene { display: none; }
    #stage[data-shown="wait"] .scene-wait,
    #stage[data-shown="lever"] .scene-lever,
    #stage[data-shown="pulley"] .scene-pulley,
    #stage[data-shown="ramp"] .scene-ramp { display: block; }

    #stage.is-live .lift {
      transform: translateY(-10px);
      transition: transform 280ms linear;
    }

    #result {
      margin: 0;
      min-height: 4.6em;
      padding: 10px 12px 12px;
      background: var(--paper);
      border-radius: 0 0 6px 6px;
    }

    .rail {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    button {
      appearance: none;
      margin: 0;
      min-height: 48px;
      padding: 8px 4px 10px;
      border: 2px solid var(--ink);
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
      font: inherit;
      font-size: 1rem;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      cursor: pointer;
    }

    button svg {
      width: 100%;
      height: 36px;
      margin-bottom: 4px;
    }

    button[aria-pressed="true"] {
      background: var(--yellow);
    }

    button.is-lesson {
      box-shadow: inset 0 -4px 0 var(--crate);
    }

    button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    @media (hover: hover) and (pointer: fine) {
      button:hover { background: #fff; }
      button[aria-pressed="true"]:hover { background: var(--yellow); }
    }

    @media (prefers-reduced-motion: reduce) {
      #stage.is-live .lift { transform: none; transition: none; }
    }

    html[data-reduced-motion="true"] #stage.is-live .lift {
      transform: none;
      transition: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Lift the crate</h1>
    <p class="prompt">Same crate. Three machines. A smaller push takes a longer path.</p>
    <div id="stage" data-shown="wait">
      <svg viewBox="0 0 320 148" role="img" aria-labelledby="drawing-title">
        <title id="drawing-title">A crate waiting to be lifted</title>
        <g class="scene scene-wait">
          <rect x="128" y="78" width="64" height="52" fill="#c4532a"></rect>
          <rect x="128" y="78" width="64" height="10" fill="#8d3418"></rect>
          <line x1="24" y1="130" x2="296" y2="130" stroke="#efe2c4" stroke-width="3"></line>
        </g>
        <g class="scene scene-lever">
          <line x1="24" y1="132" x2="296" y2="132" stroke="#3e5c6b" stroke-width="3"></line>
          <polygon points="132,132 156,132 144,104" fill="#6e4528"></polygon>
          <g class="lift">
            <line x1="36" y1="96" x2="292" y2="118" stroke="#d7e4ea" stroke-width="8" stroke-linecap="round"></line>
            <rect x="40" y="62" width="40" height="34" fill="#c4532a"></rect>
            <circle cx="268" cy="112" r="14" fill="#f0b429"></circle>
          </g>
          <text x="144" y="28" fill="#f4f8f9" font-size="14" text-anchor="middle">Fulcrum</text>
          <text x="60" y="56" fill="#f4f8f9" font-size="14">Crate</text>
          <text x="236" y="96" fill="#f0b429" font-size="14">Push</text>
        </g>
        <g class="scene scene-pulley">
          <rect x="108" y="16" width="104" height="8" fill="#3e5c6b"></rect>
          <path d="M160 24 V58 A22 22 0 1 0 204 80 H204 V28" fill="none" stroke="#efe2c4" stroke-width="4"></path>
          <g class="lift">
            <circle cx="160" cy="80" r="22" fill="none" stroke="#d7e4ea" stroke-width="6"></circle>
            <rect x="136" y="100" width="48" height="32" fill="#c4532a"></rect>
          </g>
          <circle cx="214" cy="112" r="12" fill="#f0b429"></circle>
          <text x="70" y="78" fill="#efe2c4" font-size="14">Rope</text>
          <text x="136" y="78" fill="#f4f8f9" font-size="13">Wheel</text>
          <text x="230" y="108" fill="#f0b429" font-size="14">Pull</text>
        </g>
        <g class="scene scene-ramp">
          <polygon points="36,132 250,132 250,62" fill="#3e5c6b"></polygon>
          <line x1="250" y1="62" x2="250" y2="132" stroke="#c4532a" stroke-width="3" stroke-dasharray="4 4"></line>
          <g class="lift">
            <rect x="118" y="78" width="40" height="32" fill="#c4532a" transform="rotate(-19 138 94)"></rect>
          </g>
          <line x1="70" y1="124" x2="132" y2="102" stroke="#f0b429" stroke-width="4" stroke-linecap="round"></line>
          <text x="40" y="28" fill="#f4f8f9" font-size="14">Slope</text>
          <text x="64" y="116" fill="#f0b429" font-size="14">Push</text>
          <text x="258" y="100" fill="#c4532a" font-size="13">Lift</text>
        </g>
      </svg>
    </div>
    <p id="result">Tap a machine to lift the crate. The numbers are the ideal case, with nothing rubbing.</p>
    <div class="rail">
      <button type="button" data-machine="lever" aria-pressed="false">
        <svg viewBox="0 0 64 36" aria-hidden="true">
          <polygon points="28,32 40,32 34,18" fill="#6e4528"></polygon>
          <line x1="4" y1="16" x2="60" y2="26" stroke="#142b36" stroke-width="3" stroke-linecap="round"></line>
          <rect x="6" y="6" width="12" height="10" fill="#c4532a"></rect>
        </svg>
        Lever
      </button>
      <button type="button" data-machine="pulley" aria-pressed="false">
        <svg viewBox="0 0 64 36" aria-hidden="true">
          <rect x="18" y="2" width="28" height="3" fill="#142b36"></rect>
          <circle cx="28" cy="16" r="8" fill="none" stroke="#142b36" stroke-width="2"></circle>
          <path d="M28 5 V12 M36 16 V30" fill="none" stroke="#6e4528" stroke-width="2"></path>
          <rect x="20" y="24" width="16" height="10" fill="#c4532a"></rect>
        </svg>
        Pulley
      </button>
      <button type="button" data-machine="ramp" aria-pressed="false">
        <svg viewBox="0 0 64 36" aria-hidden="true">
          <polygon points="4,32 60,32 60,8" fill="#3e5c6b"></polygon>
          <rect x="28" y="16" width="14" height="10" fill="#c4532a"></rect>
        </svg>
        Ramp
      </button>
    </div>
  </main>
  <script>
    (function () {
      var FACTS = {
        lever: {
          advantage: 2,
          push: 6,
          text: "Your hand is twice as far from the fulcrum as the crate. You push 6, and your hand moves twice as far."
        },
        pulley: {
          advantage: 2,
          push: 6,
          text: "Two parts of the rope hold the crate. You pull 6, and you pull twice as much rope."
        },
        ramp: {
          advantage: 3,
          push: 4,
          text: "The slope is three times as long as the lift is high. You push 4, and you walk three times as far."
        }
      };

      function known(name) {
        return Object.prototype.hasOwnProperty.call(FACTS, name);
      }

      var stage = document.getElementById("stage");
      var result = document.getElementById("result");
      var title = document.getElementById("drawing-title");
      var buttons = document.querySelectorAll("[data-machine]");

      function show(machine, lesson, still) {
        var fact = FACTS[machine];
        stage.setAttribute("data-shown", machine);
        stage.classList.toggle("is-live", !still);
        title.textContent = "A " + machine + " lifting a crate of 12";
        var sentence = "Crate 12. Push " + fact.push + ". Advantage " + fact.advantage + ". " + fact.text;
        if (known(lesson) && lesson !== machine) {
          sentence += " This lesson named the " + lesson + ", advantage " + FACTS[lesson].advantage + ".";
        }
        result.textContent = sentence;
        for (var i = 0; i < buttons.length; i++) {
          var key = buttons[i].getAttribute("data-machine");
          buttons[i].setAttribute("aria-pressed", key === machine ? "true" : "false");
          buttons[i].classList.toggle("is-lesson", key === lesson);
        }
      }

      function onMachine(event) {
        var kit = window.ArtifactKit;
        var params = kit && kit.params ? kit.params : {};
        var named = typeof params.machine === "string" ? params.machine : "lever";
        var picked = event.currentTarget.getAttribute("data-machine");
        var machine = known(picked) ? picked : "lever";
        if (picked === "lever" && known(named)) machine = named;
        if (!known(named)) named = machine;
        show(machine, named, !!(kit && kit.reducedMotion));
        kit.emit("machine_selected", { machine: machine });
        kit.emit("advantage_compared", { machine: machine, advantage: FACTS[machine].advantage });
      }

      for (var i = 0; i < buttons.length; i++) buttons[i].addEventListener("click", onMachine);
    })();
  </script>
</body>
</html>
