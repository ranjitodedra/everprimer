<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shape Compare</title>
  <style>
    :root { color: #1c1915; background: #f6f1e7; font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px 16px 20px; }
    h1 { margin: 0 0 8px; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
    p { margin: 0 0 12px; font-size: 1.05rem; line-height: 1.35; }
    button {
      display: block;
      width: 100%;
      min-height: 48px;
      margin: 0 0 12px;
      padding: 12px 16px;
      border: 0;
      border-radius: 8px;
      background: #1c1915;
      color: #f6f1e7;
      font: inherit;
      font-size: 1.125rem;
      touch-action: manipulation;
    }
    button:focus-visible { outline: 3px solid #d0892c; outline-offset: 3px; }
    canvas { display: block; width: 100%; height: 200px; background: #fffdf8; border-radius: 8px; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 12px 0; }
    .legend span { font-size: 1rem; }
    #readout { min-height: 2.7em; }
    #side-note[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Shape Compare</h1>
  <p>Turn the square. Count corners on each shape.</p>
  <button type="button" data-shape="a">Turn shape A</button>
  <canvas id="view" width="320" height="180" aria-hidden="true"></canvas>
  <div class="legend">
    <span>Square: 4 sides, 4 corners.</span>
    <span>Circle: 0 corners.</span>
  </div>
  <p id="side-note" hidden>Side view of the same square and circle.</p>
  <p id="readout">The square is shape A. The circle is beside it.</p>
  <script type="module" src="./scene.js"></script>
</body>
</html>
